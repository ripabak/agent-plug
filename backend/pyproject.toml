[project]
name = "agent-plug-backend"
version = "0.1.0"
description = "Agent-Plug backend: RAG-powered AI agents embeddable on any website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0,<5",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "asyncpg>=0.30",
    "greenlet>=3.5.4",
    "langchain>=0.3",
    "langchain-openrouter",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "beautifulsoup4>=4.12",
    "pydantic[email]",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.1",
    "pypdf>=6.14.2",
    "geoip2>=5.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "anyio",
    "pyright>=1.1.411",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
pythonVersion = "3.14"
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
