# Agent-Plug — simple Docker setup
#
#   docker compose up --build
#
# Services:
#   db       PostgreSQL 17 (data persisted in the `pgdata` volume)
#   backend  FastAPI app (uvicorn on :8000) — API + widget.js
#   frontend the built Vue dashboard served by `vite preview` (bun) on :5173,
#            calling the backend directly at http://localhost:8000 (CORS)
#
# Uploaded PDFs/avatars disimpan ke S3 EKSTERNAL saat STORAGE_BACKEND=s3
# (isi S3_ENDPOINT_URL / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET di .env) —
# tidak ada object storage yang di-host di compose ini.
#
# Semua konfigurasi backend (termasuk OPENROUTER_API_KEY) didefinisikan di
# bawah ini dan diisi lewat file `.env` di root repo (copy dari .env.example) —
# setiap variabel punya default aman. backend/.env & frontend/.env hanya untuk
# dev lokal (uv run / bun dev), bukan untuk Docker.
#
#   cp .env.example .env      # isi OPENROUTER_API_KEY dll.
#   docker compose up --build
#
# URLs:
#   Dashboard : http://localhost:5173
#   API docs  : http://localhost:8000/docs
#   Widget    : http://localhost:8000/api/public/widget.js

name: agent-plug

services:
  db:
    # pgvector image: PostgreSQL 17 + ekstensi `vector` sudah terpasang
    # (stock postgres:17-alpine TIDAK punya pgvector → CREATE EXTENSION gagal).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: agent-plug
    ports:
      # Exposed on a non-default host port so it never conflicts with a local
      # Postgres already running on 5432. Remove if you don't need host access.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent-plug"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # DB host is the compose service name `db`, not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/agent-plug
      # JWT signing secret — set a random one in .env (e.g. `openssl rand -hex 32`).
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      # Comma-separated origins allowed by CORS (dashboard + widget test pages).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Public base URL used to build the embed snippet / widget script URL.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      # OpenRouter (LLM + embeddings) — REQUIRED for chat & indexing.
      # Isi di root .env: OPENROUTER_API_KEY=sk-or-v1-...
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-perplexity/pplx-embed-v1-0.6b}
      # Max sources indexed concurrently (server-wide); the rest queue with
      # status "Queued" in the dashboard.
      INDEX_CONCURRENCY: ${INDEX_CONCURRENCY:-3}
      # Storage for uploaded PDFs/avatars: local (volume `uploads`) atau S3
      # EKSTERNAL (isi S3_ENDPOINT_URL dkk di .env — SeaweedFS/MinIO/AWS S3).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-agent-plug}
      S3_PREFIX: ${S3_PREFIX:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded PDFs persist across container restarts (STORAGE_BACKEND=local).
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Backend API base URL baked into the dashboard at build time.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
